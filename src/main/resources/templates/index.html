
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masseiras do Sertão - Pedidos</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #fff8ed;
            color: #333;
        }

        header {
            background-color: #8b4513;
            color: white;
            padding: 25px;
            text-align: center;
        }

        main {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }

        .opcoes {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 35px;
        }

        .botao {
            background-color: #d68a35;
            color: white;
            padding: 18px 25px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
        }

        .botao:hover {
            background-color: #a65c20;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #666;
        }
    </style>
</head>

<body>

    <header>
        <h1>Masseiras do Sertão</h1>
        <p>Sistema de Controle de Pedidos</p>
    </header>

    <main>
        <h2>Bem-vindo ao sistema!</h2>

        <p>
            Organize os pedidos, acompanhe as entregas
            e facilite o trabalho do dia a dia.
        </p>

        

<div class="opcoes">
    <a th:href="@{/clientes/novo}" class="botao">Cadastrar Cliente</a>
    <a th:href="@{/clientes}" class="botao">Consultar Clientes</a>

    <a th:href="@{/produtos/novo}" class="botao">Cadastrar Produto</a>
    <a th:href="@{/produtos}" class="botao">Consultar Produtos</a>

    <a th:href="@{/pedidos/novo}" class="botao">Novo Pedido</a>
    <a th:href="@{/pedidos}" class="botao">Consultar Pedidos</a>

</div>


    </main>

    <footer>
        <p>Masseiras do Sertão - Juazeiro/BA</p>
    </footer>

</body>
</html>
